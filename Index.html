<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página web</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    header {
      background: #174a7e;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .portada {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: white;
    }

    .contenido {
      max-width: 700px;
    }

    h2 {
      font-size: 42px;
      margin-bottom: 15px;
      color: #174a7e;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
    }

    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      background: #d89b28;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #174a7e;
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mi proyecto</h1>

    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main id="inicio" class="portada">
    <div class="contenido">
      <h2>Bienvenido a mi página</h2>

      <p>
        Aquí podrás encontrar información, servicios y novedades.
      </p>

      <a class="boton" href="#contacto">Conócenos</a>
    </div>
  </main>

  <footer id="contacto">
    © 2026 Mi proyecto
  </footer>
</body>
</html>
